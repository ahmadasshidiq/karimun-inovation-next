  <!-- Sea / Bottom Half -->
  <path d="M34 115 H166 V126 C166 172 138 204 100 218 C62 204 34 172 34 126 V115 Z" fill="#0284C7"/>
  
  <!-- Waves -->
  <path d="M34 140 C55 130 75 145 100 135 C125 125 145 140 166 130 V150 C145 160 125 145 100 155 C75 165 55 150 34 160 Z" fill="#FFFFFF" opacity="0.8"/>
  <path d="M34 165 C55 155 75 170 100 160 C125 150 145 165 166 155 V175 C145 185 125 170 100 180 C75 190 55 175 34 185 Z" fill="#FACC15" opacity="0.9"/>

