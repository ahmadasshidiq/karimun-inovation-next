  <text x="100" y="202" fill="#0B1F4B" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="1">BERAZAM</text>
  
  <text x="100" y="112" fill="#FFFFFF" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.5">KARIMUN</text>
</svg>
