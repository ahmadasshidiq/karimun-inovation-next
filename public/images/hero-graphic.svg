<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" fill="none">
  <!-- Background Card -->
  <rect x="20" y="20" width="560" height="440" rx="24" fill="#0B1F4B"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M20 100H580M20 180H580M20 260H580M20 340H580M20 420H580" stroke="#1B3B6F" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <path d="M100 20V460M200 20V460M300 20V460M400 20V460M500 20V460" stroke="#1B3B6F" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Center Hub Card -->
  <rect x="180" y="80" width="240" height="130" rx="16" fill="#142E6B" stroke="#1D4ED8" stroke-width="2"/>
  <rect x="200" y="102" width="40" height="40" rx="8" fill="#1D4ED8"/>
  <path d="M212 122H228M220 114V130" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <text x="252" y="120" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">INDEKS INOVASI</text>
  <text x="252" y="136" fill="#94B4D9" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Data Terintegrasi 36 Indikator</text>
  
  <rect x="200" y="158" width="200" height="6" rx="3" fill="#0B1F4B"/>
  <rect x="200" y="158" width="168" height="6" rx="3" fill="#1D4ED8"/>
  <text x="200" y="186" fill="#EFF6FF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">Skor Kematangan Daerah: Sangat Inovatif</text>

  <!-- Connecting Lines -->
  <path d="M300 210V260M300 260H160V290M300 260H440V290" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round"/>

  <!-- Left Node: Tata Kelola (SPD) -->
  <g transform="translate(60, 290)">
    <rect width="200" height="120" rx="14" fill="#0E275E" stroke="#1E3E8C" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="16" fill="#1D4ED8" opacity="0.25"/>
    <path d="M30 36L34 40L42 32" stroke="#60A5FA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="34" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Satuan SPD</text>
    <text x="64" y="50" fill="#94B4D9" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Tata Kelola & Kebijakan</text>
    
    <rect x="24" y="74" width="152" height="8" rx="4" fill="#142E6B"/>
    <rect x="24" y="74" width="128" height="8" rx="4" fill="#3B82F6"/>
    <text x="24" y="100" fill="#94B4D9" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Kepatuhan Berkas: 94%</text>
  </g>

  <!-- Right Node: Pelayanan Publik (SPP) -->
  <g transform="translate(340, 290)">
    <rect width="200" height="120" rx="14" fill="#0E275E" stroke="#1E3E8C" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="16" fill="#1D4ED8" opacity="0.25"/>
    <path d="M30 36L34 40L42 32" stroke="#60A5FA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="34" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700">Satuan SPP</text>
    <text x="64" y="50" fill="#94B4D9" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Layanan Publik & Sosial</text>
    
    <rect x="24" y="74" width="152" height="8" rx="4" fill="#142E6B"/>
    <rect x="24" y="74" width="140" height="8" rx="4" fill="#3B82F6"/>
    <text x="24" y="100" fill="#94B4D9" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Verifikasi Evidensi: 92%</text>
  </g>

  <!-- Top Badge -->
  <g transform="translate(230, 42)">
    <rect width="140" height="26" rx="13" fill="#1D4ED8" opacity="0.3"/>
    <circle cx="242" cy="55" r="4" fill="#60A5FA"/>
    <text x="252" y="59" fill="#EFF6FF" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">SISTEM AKTIF 2026</text>
  </g>
</svg>
