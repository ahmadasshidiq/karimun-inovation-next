  <!-- Clipboard / Validation Board -->
  <rect x="220" y="50" width="200" height="260" rx="16" fill="#142E6B" stroke="#1D4ED8" stroke-width="2"/>
  
  <!-- Clipboard Clip -->
  <rect x="270" y="38" width="100" height="24" rx="6" fill="#1D4ED8"/>
  <rect x="290" y="44" width="60" height="12" rx="3" fill="#0B1F4B"/>

  <!-- Checklist Rows -->
  <g transform="translate(245, 85)">
