    <path d="M8 12L11 15L16 9" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <rect x="32" y="8" width="120" height="8" rx="4" fill="#60A5FA"/>
  </g>

  <g transform="translate(245, 125)">
    <circle cx="12" cy="12" r="10" fill="#10B981"/>
    <path d="M8 12L11 15L16 9" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <rect x="32" y="8" width="110" height="8" rx="4" fill="#60A5FA"/>
  </g>

  <g transform="translate(245, 165)">
    <circle cx="12" cy="12" r="10" fill="#10B981"/>
    <path d="M8 12L11 15L16 9" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <rect x="32" y="8" width="125" height="8" rx="4" fill="#60A5FA"/>
  </g>

  <g transform="translate(245, 205)">
